# PR sanity — headless gates on every push/PR (D-04).
#
# Adapted from Djarvur/goswitch pr-sanity.yml (sibling repo; local clone read
# this session). Exact deltas from the template:
#   - push branch master (the template says main — this repo's default branch
#     is master);
#   - an added `test (experiments suite)` step running the Phase-1 node suite
#     (`mise run test-experiments`);
#   - an added third job `secret-scan` (D-05): the fixed experiments gate
#     script runs over the whole tree on every push/PR;
#   - the docs conformance gate (`check-docs.sh`) runs as a second step inside
#     that same job (RESEARCH Open Question 1, resolved: the docs gate shares
#     the secret-scan job's required context instead of adding a fourth name);
#   - native macOS arm64/amd64 jobs run the canonical CI graph after explicit
#     architecture and tool-version preflights;
#   - a separate Linux job runs both literal CGO-free Darwin cross-builds.
#
# Gates: build + vet + golangci-lint + test -race + experiments suite + managed
# shell gates + tidy-diff on Linux and both native macOS architectures, plus
# separate Darwin cross-build, govulncheck, and secret-scan jobs. Native jobs
# call exactly the same tasks as the local `mise run ci` (D-02).
#
# Tool source: `mise install` reads mise.toml — the single place where tool
# versions live. setup-go / golangci-lint-action are rejected on purpose (the
# goswitch rationale, carried over): their `version:` inputs would pin a tool a
# SECOND time and drift from mise.toml; mise gives exact parity with the local
# dev loop.
#
# CI exercises only the offline tiers (go suite, node experiments suite,
# static gates) — no workflow here ever calls api.z.ai or spawns the real
# ZCode desktop.
name: pr-sanity

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Minimal default token rights; no secrets are used by any job.
permissions:
  contents: read

concurrency:
  # Event name keeps a push and a pull_request for the same ref from
  # cancelling each other.
  group: pr-sanity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    # This string is a branch-protection required check name (plan 02-05):
    # the ` / ` separators are load-bearing — never rename without updating
    # the protection body in the same change.
    name: build / vet / lint / test / tidy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Official mise installer (mise.run is the canonical distribution point
      # of jdx/mise; ephemeral runner, read-only token rights, no secrets).
      - name: Install mise
        run: curl https://mise.run | sh

      - name: Add mise to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Installs go, golangci-lint and node at exactly the versions pinned in
      # mise.toml — the single source of tool versions (D-02).
      - name: Install tools from mise.toml
        run: mise install

      - name: build
        run: mise run build

      - name: vet
        run: mise run vet

      # golangci-lint pinned EXACTLY (2.15.0) in mise.toml — strict config.
      - name: golangci-lint
        run: mise run lint

      - name: test (go)
        run: mise run test

      # Phase-1 node suite (node --test experiments/) — the real test gate
      # until Go tests arrive in Phase 3.
      - name: test (experiments suite)
        run: mise run test-experiments

      # go mod tidy + git diff --exit-code — go.mod/go.sum drift fails the job.
      - name: modules are tidy
        run: mise run tidy-diff

  macos-arm64:
    name: build / vet / lint / test / tidy (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        run: curl https://mise.run | sh

      - name: Add mise to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # mise has no Bash tool plugin. macOS runners carry Bash 3.2, so install
      # Homebrew Bash 5 and prepend it before the PATH Bash requirement is read.
      - name: Install Bash 5 via Homebrew
        run: brew install bash

      - name: Prepend Homebrew Bash to PATH
        run: echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install tools from mise.toml
        run: mise install

      # Runner labels are assumptions until observed in CI. Fail before any
      # build/test gate unless both the Go toolchain and host report arm64.
      - name: Verify native architecture
        env:
          EXPECTED_GOARCH: arm64
          EXPECTED_UNAME_M: arm64
        run: |
          printf 'GOARCH=%s\n' "$(mise exec -- go env GOARCH)"
          printf 'uname -m=%s\n' "$(uname -m)"
          test "$(mise exec -- go env GOARCH)" = "$EXPECTED_GOARCH"
          test "$(uname -m)" = "$EXPECTED_UNAME_M"

      # Print four mise-resolved versions and the PATH-level Bash line; fail on
      # any pin or requirement drift.
      - name: Verify mise tool versions
        run: mise exec -- node scripts/check-mise-tool-versions.mjs

      # The canonical task includes CGO-enabled native race tests and the
      # managed Bash shell gates. Cross-build CGO settings stay out of this job.
      - name: Canonical CI gate
        run: mise run ci

      - name: Modules are tidy
        run: mise run tidy-diff

  macos-amd64:
    name: build / vet / lint / test / tidy (macOS amd64)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        run: curl https://mise.run | sh

      - name: Add mise to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # mise has no Bash tool plugin. Install and prepend Homebrew Bash 5
      # before the PATH-level Bash requirement is checked.
      - name: Install Bash 5 via Homebrew
        run: brew install bash

      - name: Prepend Homebrew Bash to PATH
        run: echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install tools from mise.toml
        run: mise install

      # Fail before any build/test gate unless both the Go toolchain and host
      # report Intel's amd64 / x86_64 architecture.
      - name: Verify native architecture
        env:
          EXPECTED_GOARCH: amd64
          EXPECTED_UNAME_M: x86_64
        run: |
          printf 'GOARCH=%s\n' "$(mise exec -- go env GOARCH)"
          printf 'uname -m=%s\n' "$(uname -m)"
          test "$(mise exec -- go env GOARCH)" = "$EXPECTED_GOARCH"
          test "$(uname -m)" = "$EXPECTED_UNAME_M"

      - name: Verify mise tool versions
        run: mise exec -- node scripts/check-mise-tool-versions.mjs

      - name: Canonical CI gate
        run: mise run ci

      - name: Modules are tidy
        run: mise run tidy-diff

  darwin-cross-build:
    name: darwin-cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        run: curl https://mise.run | sh

      - name: Add mise to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install tools from mise.toml
        run: mise install

      - name: Verify mise tool versions
        run: mise exec -- node scripts/check-mise-tool-versions.mjs

      # Compile-only portability gate: keep both literal required target
      # commands separate from the native CGO-enabled race-test jobs.
      - name: Cross-build darwin/arm64
        run: mise exec -- env CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...

      - name: Cross-build darwin/amd64
        run: mise exec -- env CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./...

  govulncheck:
    # Required check name (plan 02-05).
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        run: curl https://mise.run | sh

      - name: Add mise to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install tools from mise.toml
        run: mise install

      # Network-side tool by design: govulncheck and its vulnerability DB are
      # fetched here only — the local gate does not mirror it. Non-zero exit
      # on reachable vulnerabilities turns the job red.
      #
      # golang.org/x/vuln is the Go team's first-party module, run on an
      # ephemeral runner with read-only token rights and no secrets. If
      # @latest ever requires a newer toolchain, raise the go pin in
      # mise.toml together with the go.mod directive — one place.
      - name: run govulncheck
        run: mise exec -- go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secret-scan:
    # Required check name (plan 02-05; D-05 promotion of the Phase-1 gate).
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        run: curl https://mise.run | sh

      - name: Add mise to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install tools from mise.toml
        run: mise install

      # Fixed gate script (WR-01/IN-03 corrected in plan 02-03): fails on any
      # tracked file outside .planning matching a live-credential value shape.
      # The named task selects the runner's PATH Bash 5 instead of the system shell.
      - name: secret scan
        run: mise run secret-scan

      # Docs conformance gate shares this job (resolved Open Question 1):
      # protected via this job's required context, no fourth check name.
      - name: docs conformance gate
        run: mise run check-docs
