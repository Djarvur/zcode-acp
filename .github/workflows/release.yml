name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  snapshot:
    name: goreleaser snapshot (macOS universal)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        run: curl https://mise.run | sh

      - name: Add mise to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # mise has no Bash tool plugin. Install and prepend Homebrew Bash 5
      # before mise install and the version gate.
      - name: Install Bash 5 via Homebrew
        run: brew install bash

      - name: Prepend Homebrew Bash to PATH
        run: echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install tools from mise.toml
        run: mise install

      - name: Validate tool versions
        run: GOPROXY=off mise exec -- node scripts/check-mise-tool-versions.mjs go goreleaser bash

      - name: Download frozen Go modules
        timeout-minutes: 5
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          mise exec -- go mod download
          git diff --exit-code HEAD -- go.mod go.sum

      - name: Verify frozen modules offline
        run: |
          GOPROXY=off mise exec -- go mod verify
          GOPROXY=off mise run tidy-diff

      - name: Require Apple release tools
        run: |
          command -v lipo
          command -v shasum

      - name: Validate GoReleaser config
        run: GOPROXY=off mise exec -- goreleaser check

      - name: Build release snapshot
        run: GOPROXY=off mise exec -- goreleaser release --snapshot --clean --skip=publish

      - name: Verify Darwin snapshot artifacts
        run: mise exec -- bash scripts/verify-darwin-release.sh dist

      - name: Upload Darwin snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darwin-snapshot-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/zcode-acp_*_darwin_arm64.tar.gz
            dist/zcode-acp_*_darwin_amd64.tar.gz
            dist/zcode-acp_*_darwin_universal.tar.gz
            dist/checksums.txt

  release:
    name: goreleaser release
    needs: snapshot
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        run: curl https://mise.run | sh

      - name: Add mise to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # mise has no Bash tool plugin. Install and prepend Homebrew Bash 5
      # before mise install and the version gate.
      - name: Install Bash 5 via Homebrew
        run: brew install bash

      - name: Prepend Homebrew Bash to PATH
        run: echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install tools from mise.toml
        run: mise install

      - name: Validate tool versions
        run: GOPROXY=off mise exec -- node scripts/check-mise-tool-versions.mjs go goreleaser bash

      - name: Download frozen Go modules
        timeout-minutes: 5
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          mise exec -- go mod download
          git diff --exit-code HEAD -- go.mod go.sum

      - name: Verify frozen modules offline
        run: |
          GOPROXY=off mise exec -- go mod verify
          GOPROXY=off mise run tidy-diff

      - name: Require Apple release tools
        run: |
          command -v lipo
          command -v shasum

      - name: Validate GoReleaser config
        run: GOPROXY=off mise exec -- goreleaser check

      - name: goreleaser release
        run: GOPROXY=off mise exec -- goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
