version: 2

project_name: zcode-acp

builds:
  - id: linux-amd64
    main: ./cmd/zcode-acp
    binary: zcode-acp
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: [-s, -w, -X, "main.version=18.1.9+zacp.{{ .Version }}"]
  - id: linux-arm64
    main: ./cmd/zcode-acp
    binary: zcode-acp
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags: [-s, -w, -X, "main.version=18.1.9+zacp.{{ .Version }}"]
  - id: darwin-arm64
    main: ./cmd/zcode-acp
    binary: zcode-acp
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags: [-s, -w, -X, "main.version=18.1.9+zacp.{{ .Version }}"]
  - id: darwin-amd64
    main: ./cmd/zcode-acp
    binary: zcode-acp
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: [-s, -w, -X, "main.version=18.1.9+zacp.{{ .Version }}"]
  - id: windows-amd64
    main: ./cmd/zcode-acp
    binary: zcode-acp
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: [-s, -w, -X, "main.version=18.1.9+zacp.{{ .Version }}"]

universal_binaries:
  - id: darwin-universal
    ids: [darwin-arm64, darwin-amd64]
    name_template: zcode-acp
    replace: false

archives:
  # Binaries come from ids. This non-matching extra-file glob suppresses
  # GoReleaser's default README/LICENSE members without adding another file.
  # Windows gets the conventional zip container; every other target tar.gz.
  - id: thin
    ids: [linux-amd64, linux-arm64, darwin-arm64, darwin-amd64, windows-amd64]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [".zcode-acp-no-extra-files-*"]
    name_template: "zcode-acp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: darwin-universal
    ids: [darwin-universal]
    formats: [tar.gz]
    files: [".zcode-acp-no-extra-files-*"]
    name_template: "zcode-acp_{{ .Version }}_darwin_universal"

checksum:
  name_template: checksums.txt
  algorithm: sha256
